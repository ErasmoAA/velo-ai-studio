name: Recover accidental studio change

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  recover:
    if: ${{ github.event.before == 'c879a4808287a566374f3eaff3ee33ffd0e9b142' }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restore studio and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git revert --no-edit c879a4808287a566374f3eaff3ee33ffd0e9b142
          git rm .github/workflows/recover-accidental-studio-change.yml
          git commit --amend --no-edit
          git push origin HEAD:main
