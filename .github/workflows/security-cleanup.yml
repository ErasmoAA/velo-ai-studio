name: Security cleanup

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  cleanup:
    if: ${{ github.event.before == 'dcba42550de1ff5552cf2d4702562b83c7bd3855' }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Remove third-party ad worker and studio script
        run: |
          set -e
          sed -i '/quge5\.com\/88\/tag\.min\.js/d' studio.html
          git rm sw.js
          git rm .github/workflows/security-cleanup.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add studio.html
          git commit -m "security: remove remote ad worker and studio ad script"
          git push origin HEAD:main
