name: Fix duplicate rescue reason DOM id

on:
  push:
    paths:
      - '.github/workflows/fix-rescue-id.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fix duplicate DOM id
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('studio.html')
          s = p.read_text(encoding='utf-8')
          old = 'id="rescueReasonText"'
          new = 'class="rescueReasonText"'
          if s.count(old) != 2:
              raise SystemExit(f'Expected exactly 2 rescueReasonText ids, found {s.count(old)}')
          s = s.replace(old, new)
          old_js = "document.getElementById('rescueReasonText').innerText = lastFriendlyError;"
          new_js = "const rescueReason = document.querySelector('.rescueReasonText');\n          if (rescueReason) rescueReason.innerText = lastFriendlyError;"
          if old_js not in s:
              raise SystemExit('Expected JS assignment not found')
          s = s.replace(old_js, new_js)
          p.write_text(s, encoding='utf-8')
          PY

      - name: Commit fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add studio.html
          git diff --cached --quiet && exit 0
          git commit -m 'fix: remove duplicate rescue reason DOM id'
          git push
