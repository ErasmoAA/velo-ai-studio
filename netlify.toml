[build]
  command   = "npm install && npm run build"
  publish   = "_site"

[build.environment]
  NODE_VERSION = "20"

# Redirect /admin to Decap CMS panel
[[redirects]]
  from   = "/admin"
  to     = "/admin/index.html"
  status = 200

# SPA fallback — serve index.html for unknown paths at root
[[redirects]]
  from   = "/*"
  to     = "/index.html"
  status = 404
